<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Birthday My Girl 🎀</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --p: #9333ea; --pm: #a855f7; --pl: #c084fc;
    --soft: #ede9fe; --deep: #581c87;
    --pink: #f472b6; --pinkd: #ec4899;
    --white: #ffffff; --cream: #fdf4ff;
    --gold: #fbbf24;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘Quicksand’, sans-serif;
background: var(–deep);
min-height: 100vh;
overflow-x: hidden;
}

/* ── STARS BACKGROUND ── */
.stars-bg {
position: fixed; inset: 0; pointer-events: none; z-index: 0;
background: radial-gradient(ellipse at 20% 20%, #4c1d95 0%, #2e1065 40%, #1a0836 100%);
overflow: hidden;
}
.stars-bg::before, .stars-bg::after {
content: ‘’;
position: absolute; inset: 0;
background-image:
radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.9) 0%, transparent 100%),
radial-gradient(1px 1px at 25% 35%, rgba(255,255,255,0.7) 0%, transparent 100%),
radial-gradient(1px 1px at 40% 10%, rgba(255,255,255,0.8) 0%, transparent 100%),
radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.6) 0%, transparent 100%),
radial-gradient(1px 1px at 70% 20%, rgba(255,255,255,0.9) 0%, transparent 100%),
radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,0.7) 0%, transparent 100%),
radial-gradient(1px 1px at 15% 75%, rgba(255,255,255,0.8) 0%, transparent 100%),
radial-gradient(1px 1px at 60% 80%, rgba(255,255,255,0.6) 0%, transparent 100%),
radial-gradient(1px 1px at 90% 40%, rgba(255,255,255,0.9) 0%, transparent 100%),
radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,0.7) 0%, transparent 100%),
radial-gradient(2px 2px at 5%  50%, rgba(200,150,255,0.8) 0%, transparent 100%),
radial-gradient(2px 2px at 78% 85%, rgba(200,150,255,0.6) 0%, transparent 100%),
radial-gradient(2px 2px at 45% 90%, rgba(244,114,182,0.7) 0%, transparent 100%),
radial-gradient(1px 1px at 92% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
radial-gradient(1px 1px at 3%  90%, rgba(255,255,255,0.6) 0%, transparent 100%);
}
.stars-bg::after {
animation: twinkle 4s ease-in-out infinite alternate;
background-image:
radial-gradient(1px 1px at 20% 25%, rgba(255,255,255,0.9) 0%, transparent 100%),
radial-gradient(1px 1px at 50% 5%,  rgba(255,255,255,0.7) 0%, transparent 100%),
radial-gradient(1px 1px at 80% 30%, rgba(255,255,255,0.8) 0%, transparent 100%),
radial-gradient(1px 1px at 65% 70%, rgba(255,255,255,0.6) 0%, transparent 100%),
radial-gradient(1px 1px at 30% 88%, rgba(255,255,255,0.7) 0%, transparent 100%),
radial-gradient(2px 2px at 95% 75%, rgba(244,114,182,0.8) 0%, transparent 100%),
radial-gradient(1px 1px at 12% 45%, rgba(255,255,255,0.5) 0%, transparent 100%);
}
@keyframes twinkle { from { opacity: 0.6 } to { opacity: 1 } }

/* ── SCENE WRAPPER ── */
.scene {
position: relative; z-index: 1;
min-height: 100vh;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
padding: 32px 20px; text-align: center;
}
.scene.hidden { display: none; }

/* ── TRANSITIONS ── */
.fade-in  { animation: fadeIn  0.6s ease both; }
.slide-up { animation: slideUp 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
@keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
@keyframes slideUp { from { opacity:0; transform:translateY(40px) } to { opacity:1; transform:translateY(0) } }
@keyframes bounce  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
@keyframes wobble  {
0%,100%{transform:rotate(-3deg)}
50%{transform:rotate(3deg)}
}
@keyframes float   { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-10px)} }
@keyframes spin    { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes heartbeat{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
@keyframes shimmer {
0%{background-position:-200% center}
100%{background-position:200% center}
}
